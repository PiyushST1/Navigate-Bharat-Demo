<title>NaViGate Design Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#EEF2F7;--card:#fff;--ink:#0B1F3A;--muted:#5B6B80;--line:#D5DDE8;--accent:#12355B;--hi:#E8871E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1626;--card:#14213a;--ink:#e8eef8;--muted:#9fb1c8;--line:#26385a;--accent:#7fb0ff;--hi:#F5A524;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1626;--card:#14213a;--ink:#e8eef8;--muted:#9fb1c8;--line:#26385a;--accent:#7fb0ff;--hi:#F5A524;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line)}
.bar h1{font:700 1.05rem Cambria,Georgia,serif;margin:0 10px 0 0}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;min-width:0;text-align:left}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.tab[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab[aria-selected=true] small{color:#dbe6f3}
:root[data-theme="dark"] .tab[aria-selected=true]{color:#0d1626}
.note{margin-left:auto;color:var(--muted);font-size:.8rem}
iframe{flex:1;width:100%;border:0;background:#fff;min-height:70vh}
</style>
<div class="bar" role="tablist" aria-label="Design options">
  <h1>NaViGate Bharat 2.0: design options</h1>
  <button class="tab" role="tab" id="t-a" aria-selected="true" data-f="Concept-A.html">A. Civic Classic<small>Formal, institutional</small></button>
  <button class="tab" role="tab" id="t-b" aria-selected="false" data-f="Concept-B.html">B. Modern Public Service<small>Light, citizen-first</small></button>
  <button class="tab" role="tab" id="t-c" aria-selected="false" data-f="Concept-C_Cinematic-Gateway_Light.html">C. Cinematic Gateway<small>Light, video-first</small></button>
  <span class="note">Scroll inside each design. All text, videos and figures are sample content.</span>
</div>
<iframe id="fr" title="Design preview" src="Concept-A.html"></iframe>
<script>
(function(){
  var tabs=document.querySelectorAll(".tab"), fr=document.getElementById("fr");
  function show(btn){ tabs.forEach(function(t){t.setAttribute("aria-selected",t===btn?"true":"false");}); fr.src=btn.dataset.f; try{ location.hash=btn.id; }catch(e){} }
  tabs.forEach(function(t){ t.addEventListener("click",function(){show(t);}); });
  var h=(location.hash||"").slice(1), start=document.getElementById(h); if(start&&start.classList.contains("tab")) show(start);
})();
</script>
