<!doctype html>
<html lang="en">
<head>

<title>NaViGate Bharat CMS (Demonstration)</title>
<style>
:root{--bg:#F2F5FA;--card:#fff;--ink:#0B1F3A;--muted:#5B6B80;--line:#E1E7F0;--navy:#0F1C36;--navy2:#172947;--accent:#12355B;--blue:#2F6FED;--gold:#F5A524;--teal:#0A9A8D;--red:#D33B32;--green:#1E9E50;--side:256px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Calibri,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0}
a{color:inherit}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.demo{background:var(--gold);color:#1A1100;text-align:center;font-weight:700;font-size:.78rem;padding:.3rem 1rem;position:relative;z-index:60}

/* layout */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - 28px)}
.side{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#C9D5EA;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 28px);overflow-y:auto;z-index:50;transition:transform .25s}
.brand{display:flex;align-items:center;gap:.7rem;padding:1.1rem 1.2rem;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:2.4rem;height:2.4rem;border-radius:12px;background:conic-gradient(from 200deg,#FF9933,#fff,#138808,#FF9933);display:grid;place-items:center}
.brand .logo i{width:1.25rem;height:1.25rem;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-style:normal;color:var(--gold);font-size:.7rem}
.brand b{font:700 1.15rem Cambria,Georgia,serif;display:block;line-height:1.1}.brand b span{color:var(--gold)}
.brand small{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#8FA3C6}
.sgrp{padding:1rem .8rem .2rem}
.sgrp h4{margin:0 .6rem .4rem;font:800 .68rem Calibri,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6F85AB}
.nav button{width:100%;display:flex;align-items:center;gap:.75rem;border:0;background:transparent;color:#C9D5EA;padding:.62rem .8rem;border-radius:10px;font-weight:600;cursor:pointer;text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current=page]{background:rgba(245,165,36,.16);color:#fff}
.nav button[aria-current=page]::before{content:"";position:absolute;left:-.8rem;top:20%;bottom:20%;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.nav .badge{margin-left:auto;background:var(--gold);color:#1A1100;border-radius:999px;font-size:.72rem;font-weight:800;min-width:1.4rem;text-align:center;padding:0 .4rem}
.suser{margin-top:auto;padding:1rem;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:.7rem;align-items:center}
.av{width:2.4rem;height:2.4rem;border-radius:50%;background:linear-gradient(135deg,#2F6FED,#0A9A8D);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.suser div{min-width:0;flex:1}.suser b{display:block;color:#fff;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.suser small{color:#8FA3C6}
.suser button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:2.2rem;height:2.2rem;cursor:pointer;display:grid;place-items:center}
.suser button:hover{background:rgba(255,255,255,.1)}
.scrim{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.8rem;padding:.8rem clamp(16px,2.5vw,32px);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:2.4rem;height:2.4rem;cursor:pointer}
.crumb{font-size:.82rem;color:var(--muted)}.crumb b{display:block;color:var(--ink);font:700 1.15rem Cambria,Georgia,serif}
.gsearch{margin-left:auto;position:relative;width:min(340px,100%)}
.gsearch input{width:100%;border:1px solid var(--line);background:#F2F5FA;border-radius:999px;padding:.5rem 1rem .5rem 2.4rem}
.gsearch .ic{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:50%;width:2.5rem;height:2.5rem;cursor:pointer;display:grid;place-items:center}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:999px;font:800 .65rem/1 Calibri,sans-serif;padding:.2rem .35rem;font-style:normal}
.rolepill{background:#FFF1D6;color:#8A5200;border:1px solid #F0C777;border-radius:999px;padding:.15rem .75rem;font-weight:800;font-size:.76rem;white-space:nowrap}
.content{padding:1.4rem clamp(16px,2.5vw,32px) 3rem;max-width:1320px;width:100%}

/* ui */
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:.45rem .95rem;font-weight:700;cursor:pointer}
.btn:hover{border-color:#B9C6DA;background:#F7F9FC}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}.btn.bad{color:var(--red);border-color:#F0B9B5}.btn.bad:hover{background:#FDEDEC}
.btn.sm{padding:.25rem .65rem;font-size:.84rem;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 1px 2px rgba(15,28,54,.04)}
.card h2{font-size:1.1rem;margin-bottom:.7rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.card h2 small{font:600 .8rem Calibri,sans-serif;color:var(--muted)}
.hero{background:linear-gradient(120deg,#12355B 0%,#2F6FED 60%,#0A9A8D 100%);color:#fff;border-radius:18px;padding:1.5rem 1.6rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero h1{font-size:1.6rem}.hero p{margin:.25rem 0 0;opacity:.9}
.hero .btn{position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:1.1rem 0}
.kpi{display:flex;gap:.9rem;align-items:center}
.kpi .ki{width:2.9rem;height:2.9rem;border-radius:14px;display:grid;place-items:center;font-size:1.2rem}
.kpi b{display:block;font:700 1.8rem/1 Cambria,Georgia,serif}.kpi span{color:var(--muted);font-weight:600;font-size:.88rem}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem;margin-bottom:1rem}
.donutw{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.donut{width:9rem;height:9rem;border-radius:50%;display:grid;place-items:center;flex:none}
.donut div{width:5.8rem;height:5.8rem;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1}
.donut b{font:700 1.6rem Cambria,serif;display:block}.donut small{color:var(--muted);font-size:.72rem}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}.legend li{display:flex;align-items:center;gap:.5rem;font-weight:600}.legend i{width:.8rem;height:.8rem;border-radius:3px;display:inline-block}.legend span{margin-left:auto;color:var(--muted);padding-left:1rem}
.hbar{display:grid;grid-template-columns:8.5rem 1fr 2rem;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.88rem;font-weight:600}
.hbar .tr{height:.65rem;background:#EAF0F8;border-radius:99px;overflow:hidden}.hbar .tr i{display:block;height:100%;background:linear-gradient(90deg,#2F6FED,#0A9A8D);border-radius:99px}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.9rem}.feed li:last-child{border:0}
.feed .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--blue);margin-top:.4rem;flex:none}.feed small{color:var(--muted);display:block}
.empty{color:var(--muted);padding:1rem 0;text-align:center}

.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem}
.toolbar .sp{flex:1}
.inp{border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;background:#fff;min-width:0}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.25rem .85rem;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:.4rem .7rem;cursor:pointer;color:var(--muted)}.seg button[aria-pressed=true]{background:#EAF0F8;color:var(--ink)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:.7rem .7rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#F7F9FC}
tbody tr:hover{background:#FAFCFF}
.vt{display:flex;gap:.8rem;align-items:center}
.thumb{width:4.6rem;aspect-ratio:16/9;border-radius:8px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.thumb .ic{width:1.1rem;height:1.1rem;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.08rem .65rem;font-weight:800;font-size:.76rem;border:1px solid}
.pill::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:currentColor}
.s-Draft{color:#5B6B80;background:#EEF1F6;border-color:#D5DDE8}.s-Pending{color:#9A5A00;background:#FFF3DC;border-color:#F3CE86}.s-Published{color:#157A3C;background:#E3F6EA;border-color:#9BD6B0}.s-Rejected{color:#B02A22;background:#FDECEA;border-color:#F2B5B0}
.acts{display:flex;gap:.3rem;flex-wrap:wrap}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.vc{padding:0;overflow:hidden;display:flex;flex-direction:column}
.vc .thumb{width:100%;border-radius:0;aspect-ratio:16/9}.vc .thumb .ic{width:2.2rem;height:2.2rem}
.vc .bd{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}.vc h3{font:700 1rem Calibri,sans-serif;line-height:1.3}
.vc .meta{color:var(--muted);font-size:.84rem}
.note{color:var(--muted);font-size:.85rem}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.uc{display:flex;flex-direction:column;gap:.7rem}.uc .top{display:flex;gap:.8rem;align-items:center}.uc .av{width:3rem;height:3rem}
.uc.off{opacity:.6}
.perm td:nth-child(n+2),.perm th:nth-child(n+2){text-align:center}
.yes{color:var(--green);font-weight:800}.no{color:#B7C2D3}
select.inp{padding-right:1.6rem}
label{display:block;font-weight:700;font-size:.85rem;margin:.8rem 0 .25rem}
textarea.inp,.inp.w{width:100%}
dialog{border:0;border-radius:18px;padding:1.4rem;width:min(94vw,480px);box-shadow:0 24px 70px rgba(2,6,16,.45);color:var(--ink)}
dialog::backdrop{background:rgba(7,15,31,.6);backdrop-filter:blur(2px)}
dialog h2{margin-bottom:.4rem}
.row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem}
.toast{position:fixed;right:1.2rem;bottom:1.2rem;background:var(--navy);color:#fff;border-left:4px solid var(--gold);border-radius:10px;padding:.7rem 1.1rem;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast[hidden]{display:none}

/* login */
.lg{min-height:calc(100vh - 28px);display:grid;grid-template-columns:1.1fr 1fr}
.lg .art{background:linear-gradient(140deg,#0F1C36,#12355B 55%,#0A9A8D);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center;gap:1rem;position:relative;overflow:hidden}
.lg .art::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-140px;bottom:-140px;background:rgba(245,165,36,.18)}
.lg .art h1{font-size:2.3rem;line-height:1.1}.lg .art p{max-width:30rem;opacity:.9}
.lg .art ul{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.5rem;font-weight:600}
.lg .art li::before{content:"\2713";color:var(--gold);margin-right:.6rem;font-weight:800}
.lg .fm{display:grid;place-items:center;padding:2rem}
.lg .box{width:min(100%,400px)}
.lg .box h2{font-size:1.6rem}
.lg .err{color:var(--red);font-weight:700;min-height:1.3rem;margin-top:.6rem}

@media (max-width:1000px){.cols{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:28px;bottom:0;height:auto;width:var(--side);transform:translateX(-100%)}
  body.open .side{transform:none}
  body.open .scrim{display:block;position:fixed;inset:0;background:rgba(7,15,31,.5);z-index:45}
  .burger{display:grid;place-items:center}
  .lg{grid-template-columns:1fr}.lg .art{padding:1.6rem}.lg .art h1{font-size:1.6rem}
  .gsearch{display:none}.topbar .rolepill{margin-left:auto}
}
:focus-visible{outline:3px solid #0B5FFF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function can(a){return S&&P[S.role]&&P[S.role][a]}
function today(){return new Date().toISOString().slice(0,10)}
function init(n){return n.split(' ').map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}
function log(a){D.log.unshift({t:new Date().toLocaleString(),who:S.name,role:S.role,a:a});D.log=D.log.slice(0,200);save()}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2400)}
function count(s){return D.videos.filter(function(v){return v.status===s}).length}
function thumb(v){var c=CCOL[v.cat]||['#2F6FED','#12355B'];return '<span class="thumb" style="background:linear-gradient(135deg,'+c[0]+','+c[1]+')">'+ic('play')+'</span>'}
function pill(s){return '<span class="pill s-'+s+'">'+s+'</span>'}

/* ---------- login ---------- */
function renderLogin(){
  $('#app').innerHTML='<div class="lg"><div class="art"><div class="brand" style="border:0;padding:0"><span class="logo"><i>&#9654;</i></span><div><b>NaViGate <span>Bharat</span></b><small>Content management</small></div></div><h1>Publish with confidence.</h1><p>One workspace to draft, review and publish national video content, with clear roles and a full audit trail.</p><ul><li>Role-based access: Superadmin, Admin, Editor, Approver</li><li>Approval workflow before anything goes live</li><li>Every action recorded in the audit log</li></ul></div>'+
  '<div class="fm"><div class="box"><h2>Sign in</h2><p class="note">Demonstration only. Pick a demo account; any password works.</p>'+
  '<label for="lr">Demo account</label><select class="inp w" id="lr">'+D.users.filter(function(u){return u.active}).map(function(u){return '<option value="'+u.id+'">'+esc(u.name)+' ('+esc(u.role)+')</option>'}).join('')+'</select>'+
  '<label for="lp">Password</label><input class="inp w" id="lp" type="password" placeholder="any value">'+
  '<label for="lq">Security check: <span id="qa"></span></label><input class="inp w" id="lq" inputmode="numeric" autocomplete="off">'+
  '<div class="row"><button class="btn pri" id="lgb" style="width:100%;justify-content:center">Sign in</button></div><div class="err" id="le" role="alert"></div></div></div></div>';
  var a=2+Math.floor(Math.random()*7),b=2+Math.floor(Math.random()*7);$('#qa').textContent=a+' + '+b+' = ?';
  var pre=null;try{pre=localStorage.getItem('nb_cms_prefill')}catch(e){}
  if(pre){var u=D.users.find(function(x){return x.role===pre&&x.active});if(u)$('#lr').value=u.id;try{localStorage.removeItem('nb_cms_prefill')}catch(e){}}
  function go(){if(+$('#lq').value!==a+b){$('#le').textContent='Wrong answer to the security check. Try again.';return}
    var u=D.users.find(function(x){return x.id==$('#lr').value});S={id:u.id,name:u.name,role:u.role};
    try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}log('Signed in');view='dash';render()}
  $('#lgb').onclick=go;$('#lq').onkeydown=function(e){if(e.key==='Enter')go()};
}

/* ---------- shell ---------- */
function menu(){
  var m=[['Overview',[['dash','Dashboard','dash']]],['Content',[['videos','Videos','video'],['appr','Approvals','check']]]],adm=[];
  if(can('users'))adm.push(['users','Users','users']);if(can('audit'))adm.push(['audit','Audit log','log']);adm.push(['perm','Roles & permissions','shield']);if(can('settings'))adm.push(['set','Settings','gear']);
  m.push(['Administration',adm]);return m;
}
function title(){var r;menu().forEach(function(g){g[1].forEach(function(i){if(i[0]===view)r=i[1]})});return r||'Dashboard'}
function render(){
  if(!S||!P[S.role]){document.body.classList.remove('open');renderLogin();return}
  var pend=count('Pending');
  $('#app').innerHTML='<div class="shell"><aside class="side" id="side" aria-label="Main menu"><div class="brand"><span class="logo"><i>&#9654;</i></span><div><b>NaViGate <span>Bharat</span></b><small>CMS</small></div></div><nav class="nav">'+
   menu().map(function(g){return '<div class="sgrp"><h4>'+g[0]+'</h4>'+g[1].map(function(i){return '<button data-v="'+i[0]+'"'+(i[0]===view?' aria-current="page"':'')+'>'+ic(i[2])+'<span>'+i[1]+'</span>'+(i[0]==='appr'&&pend?'<span class="badge">'+pend+'</span>':'')+'</button>'}).join('')+'</div>'}).join('')+
   '</nav><div class="suser"><span class="av">'+esc(init(S.name))+'</span><div><b>'+esc(S.name)+'</b><small>'+esc(S.role)+'</small></div><button id="out" aria-label="Sign out" title="Sign out">'+ic('out')+'</button></div></aside><div class="scrim" id="scrim"></div>'+
   '<div class="main"><header class="topbar"><button class="burger" id="bg" aria-label="Open menu">'+ic('menu')+'</button><div class="crumb">NaViGate CMS<b>'+title()+'</b></div><div class="gsearch">'+ic('search')+'<input id="gs" placeholder="Search videos..." aria-label="Search videos"></div><button class="bell" id="bl" aria-label="'+pend+' videos awaiting approval">'+ic('bell')+(pend&&can('review')?'<i>'+pend+'</i>':'')+'</button><span class="rolepill">'+esc(S.role)+'</span></header><main class="content" id="main"></main></div></div>';
  $('#out').onclick=function(){log('Signed out');S=null;try{localStorage.removeItem(SKEY)}catch(e){}render()};
  $$('.nav [data-v]').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
  $('#bg').onclick=function(){document.body.classList.add('open')};$('#scrim').onclick=function(){document.body.classList.remove('open')};
  $('#bl').onclick=function(){go(can('review')?'appr':'videos')};
  $('#gs').value=vq;$('#gs').onkeydown=function(e){if(e.key==='Enter'){vq=this.value;go('videos')}};
  if(!menu().some(function(g){return g[1].some(function(i){return i[0]===view})}))view='dash';
  ({dash:vDash,videos:vVideos,appr:vAppr,users:vUsers,audit:vAudit,perm:vPerm,set:vSet})[view]();
}
function go(v){view=v;document.body.classList.remove('open');render();window.scrollTo(0,0)}

/* ---------- dashboard ---------- */
function vDash(){
  var st=['Published','Pending','Draft','Rejected'],col={Published:'#1E9E50',Pending:'#F5A524',Draft:'#9AA7B8',Rejected:'#D33B32'},tot=D.videos.length||1,acc=0;
  var stops=st.map(function(s){var a=acc/tot*360;acc+=count(s);return col[s]+' '+a+'deg '+(acc/tot*360)+'deg'}).join(',');
  var cc={};D.videos.forEach(function(v){cc[v.cat]=(cc[v.cat]||0)+1});var mx=Math.max.apply(null,Object.keys(cc).map(function(k){return cc[k]}).concat([1]));
  var recent=D.log.slice(0,6);
  $('#main').innerHTML='<div class="hero"><div><h1>Welcome back, '+esc(S.name.split(' ')[0])+'</h1><p>You are signed in as <b>'+esc(S.role)+'</b>. '+(count('Pending')&&can('review')?count('Pending')+' video(s) are waiting for your review.':'Here is how content is doing today.')+'</p></div>'+(can('create')?'<button class="btn" id="gN">'+ic('plus')+' New video</button>':(can('review')?'<button class="btn" id="gA">'+ic('check')+' Review approvals</button>':''))+'</div>'+
  '<div class="kpis"><div class="card kpi"><span class="ki" style="background:#E6EEFF;color:#2F6FED">'+ic('video')+'</span><div><b>'+D.videos.length+'</b><span>Total videos</span></div></div><div class="card kpi"><span class="ki" style="background:#E3F6EA;color:#1E9E50">'+ic('check')+'</span><div><b>'+count('Published')+'</b><span>Published</span></div></div><div class="card kpi"><span class="ki" style="background:#FFF3DC;color:#C77700">'+ic('clock')+'</span><div><b>'+count('Pending')+'</b><span>Awaiting approval</span></div></div><div class="card kpi"><span class="ki" style="background:#EEF1F6;color:#5B6B80">'+ic('edit')+'</span><div><b>'+count('Draft')+'</b><span>Drafts</span></div></div></div>'+
  '<div class="cols"><div class="card"><h2>Content by category <small>'+D.videos.length+' videos</small></h2>'+Object.keys(cc).sort(function(a,b){return cc[b]-cc[a]}).map(function(k){return '<div class="hbar"><span>'+esc(k)+'</span><span class="tr"><i style="width:'+cc[k]/mx*100+'%"></i></span><span>'+cc[k]+'</span></div>'}).join('')+'</div>'+
  '<div class="card"><h2>Status</h2><div class="donutw"><div class="donut" style="background:conic-gradient('+stops+')"><div><span><b>'+D.videos.length+'</b><small>videos</small></span></div></div><ul class="legend">'+st.map(function(s){return '<li><i style="background:'+col[s]+'"></i>'+s+'<span>'+count(s)+'</span></li>'}).join('')+'</ul></div></div></div>'+
  '<div class="cols"><div class="card"><h2>Needs review <small>'+count('Pending')+' pending</small></h2>'+(D.videos.filter(function(v){return v.status==='Pending'}).map(function(v){return '<div class="vt" style="padding:.5rem 0;border-bottom:1px solid var(--line)">'+thumb(v)+'<div style="flex:1;min-width:0"><b>'+esc(v.title)+'</b><div class="note">'+esc(v.author)+' &middot; '+esc(v.lang)+'</div></div>'+(can('review')?'<button class="btn sm ok" data-a="'+v.id+'">Approve</button>':'')+'</div>'}).join('')||'<div class="empty">All caught up. Nothing is waiting.</div>')+'</div>'+
  '<div class="card"><h2>Recent activity</h2>'+(recent.length?'<ul class="feed">'+recent.map(function(l){return '<li><span class="dot"></span><div>'+esc(l.a)+'<small>'+esc(l.who)+' &middot; '+esc(l.t)+'</small></div></li>'}).join('')+'</ul>':'<div class="empty">Activity will appear here.</div>')+'</div></div>'+
  (D.maint?'<div class="card" style="border-color:var(--gold)"><b>Maintenance banner is ON</b> for the public portal (set by Superadmin).</div>':'');
  var n=$('#gN');if(n)n.onclick=function(){editVideo()};var a=$('#gA');if(a)a.onclick=function(){go('appr')};bindVid();
}

/* ---------- videos ---------- */
function acts(v){
  var a='';
  if(can('edit')&&(v.status==='Draft'||v.status==='Rejected'||(S.role!=='Approver'&&can('publish'))))a+='<button class="btn sm" data-e="'+v.id+'">Edit</button>';
  if(can('submit')&&(v.status==='Draft'||v.status==='Rejected'))a+='<button class="btn sm pri" data-s="'+v.id+'">Submit</button>';
  if(can('review')&&v.status==='Pending')a+='<button class="btn sm ok" data-a="'+v.id+'">Approve</button><button class="btn sm bad" data-r="'+v.id+'">Reject</button>';
  if(can('publish')&&v.status==='Published'&&S.role!=='Approver')a+='<button class="btn sm" data-u="'+v.id+'">Unpublish</button>';
  if(can('del'))a+='<button class="btn sm bad" data-d="'+v.id+'" aria-label="Delete">Delete</button>';
  return a||'<span class="note">View only</span>';
}
function row(v){return '<tr><td><div class="vt">'+thumb(v)+'<div><b>'+esc(v.title)+'</b><div class="note">'+esc(v.cat)+' &middot; '+esc(v.lang)+' &middot; '+esc(v.dur||'')+'</div>'+(v.note?'<div class="note" style="color:var(--red)">Reviewer note: '+esc(v.note)+'</div>':'')+'</div></div></td><td>'+pill(v.status)+'</td><td>'+esc(v.author)+'<div class="note">'+v.upd+'</div></td><td><div class="acts">'+acts(v)+'</div></td></tr>'}
function bindVid(){
  function by(attr,fn){$$('['+attr+']').forEach(function(b){b.onclick=function(){fn(D.videos.find(function(v){return v.id==b.getAttribute(attr)}))}})}
  by('data-e',function(v){editVideo(v)});
  by('data-s',function(v){v.status='Pending';v.upd=today();delete v.note;log('Submitted for approval: '+v.title);save();toast('Submitted for approval');render()});
  by('data-a',function(v){v.status='Published';v.upd=today();delete v.note;log('Approved and published: '+v.title);save();toast('Published');render()});
  by('data-r',function(v){ask('Reject video','<p class="note">'+esc(v.title)+'</p><label for="rn">Reason for rejection</label><textarea class="inp w" id="rn" rows="3"></textarea>','Reject',function(){v.status='Rejected';v.note=$('#rn').value||'No reason given';v.upd=today();log('Rejected: '+v.title);save();toast('Rejected');render()})});
  by('data-u',function(v){v.status='Draft';v.upd=today();log('Unpublished: '+v.title);save();toast('Moved to Draft');render()});
  by('data-d',function(v){ask('Delete video','<p>Delete &ldquo;'+esc(v.title)+'&rdquo;? This cannot be undone.</p>','Delete',function(){D.videos=D.videos.filter(function(x){return x!==v});log('Deleted: '+v.title);save();toast('Deleted');render()})});
}
function vVideos(){
  $('#main').innerHTML='<div class="toolbar"><input class="inp" id="q" placeholder="Search title or category" aria-label="Search" style="width:min(280px,100%)"><div class="chips" id="ch">'+['All','Published','Pending','Draft','Rejected'].map(function(s){return '<button class="chip" data-st="'+s+'" aria-pressed="'+(s===vstat)+'">'+s+(s==='All'?'':' ('+count(s)+')')+'</button>'}).join('')+'</div><span class="sp"></span><div class="seg"><button id="mt" aria-label="Table view" aria-pressed="'+(vmode==='table')+'">'+ic('list')+'</button><button id="mg" aria-label="Grid view" aria-pressed="'+(vmode==='grid')+'">'+ic('grid')+'</button></div>'+(can('create')?'<button class="btn pri" id="nv">'+ic('plus')+' New video</button>':'')+'</div><div id="vl"></div>';
  function draw(){var q=vq.toLowerCase();var list=D.videos.filter(function(v){return(vstat==='All'||v.status===vstat)&&(!q||(v.title+' '+v.cat).toLowerCase().indexOf(q)>-1)});
    $('#vl').innerHTML=!list.length?'<div class="card empty">No videos match your filters.</div>':vmode==='table'?'<div class="card tw" style="padding:0"><table><thead><tr><th>Video</th><th>Status</th><th>Author</th><th>Actions</th></tr></thead><tbody>'+list.map(row).join('')+'</tbody></table></div>':'<div class="vgrid">'+list.map(function(v){return '<div class="card vc">'+thumb(v)+'<div class="bd"><div>'+pill(v.status)+'</div><h3>'+esc(v.title)+'</h3><div class="meta">'+esc(v.cat)+' &middot; '+esc(v.lang)+' &middot; '+esc(v.dur||'')+'<br>'+esc(v.author)+' &middot; '+v.upd+'</div>'+(v.note?'<div class="note" style="color:var(--red)">Reviewer note: '+esc(v.note)+'</div>':'')+'<div class="acts" style="margin-top:auto">'+acts(v)+'</div></div></div>'}).join('')+'</div>';
    bindVid()}
  $('#q').value=vq;$('#q').oninput=function(){vq=this.value;draw()};
  $$('#ch [data-st]').forEach(function(b){b.onclick=function(){vstat=b.dataset.st;render()}});
  $('#mt').onclick=function(){vmode='table';render()};$('#mg').onclick=function(){vmode='grid';render()};
  var n=$('#nv');if(n)n.onclick=function(){editVideo()};draw();
}
function vAppr(){
  var p=D.videos.filter(function(v){return v.status==='Pending'});
  $('#main').innerHTML='<div class="card">'+(p.length?'<h2>Waiting for review <small>'+p.length+' video(s)</small></h2><div class="tw"><table><thead><tr><th>Video</th><th>Status</th><th>Author</th><th>Actions</th></tr></thead><tbody>'+p.map(row).join('')+'</tbody></table></div>':'<div class="empty">Nothing is waiting for approval.</div>')+'</div>'+(can('review')?'':'<p class="note">Only Approvers, Admins and Superadmins can approve or reject.</p>');
  bindVid();
}
function editVideo(v){
  if(!can('create')&&!v)return;
  var nv=!v;v=v||{title:'',cat:CATS[0],lang:LANGS[0],desc:''};
  ask(nv?'New video':'Edit video','<label for="et">Title</label><input class="inp w" id="et" value="'+esc(v.title)+'"><label for="ec">Category</label><select class="inp w" id="ec">'+CATS.map(function(c){return '<option'+(c===v.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select><label for="el">Language</label><select class="inp w" id="el">'+LANGS.map(function(c){return '<option'+(c===v.lang?' selected':'')+'>'+c+'</option>'}).join('')+'</select><label for="ed">Description</label><textarea class="inp w" id="ed" rows="3">'+esc(v.desc||'')+'</textarea>','Save',function(){
    var t=$('#et').value.trim();if(!t){toast('Title is required');return false}
    if(nv){D.videos.unshift({id:D.nid.v++,title:t,cat:$('#ec').value,lang:$('#el').value,desc:$('#ed').value,dur:'00:00',status:'Draft',author:S.name,upd:today()});log('Created draft: '+t)}
    else{v.title=t;v.cat=$('#ec').value;v.lang=$('#el').value;v.desc=$('#ed').value;v.upd=today();log('Edited: '+t)}
    save();toast('Saved');render()});
}

/* ---------- users ---------- */
function vUsers(){
  $('#main').innerHTML='<div class="toolbar"><span class="note">'+D.users.length+' users</span><span class="sp"></span><button class="btn pri" id="nu">'+ic('plus')+' Add user</button></div><div class="ucards">'+
  D.users.map(function(u){var self=u.id===S.id,locked=u.role==='Superadmin'&&!can('roles');
   var rs=can('roles')&&!self?'<select class="inp" data-r="'+u.id+'" aria-label="Role for '+esc(u.name)+'">'+ROLES.map(function(r){return '<option'+(r===u.role?' selected':'')+'>'+r+'</option>'}).join('')+'</select>':'<span class="rolepill">'+esc(u.role)+'</span>';
   return '<div class="card uc'+(u.active?'':' off')+'"><div class="top"><span class="av">'+esc(init(u.name))+'</span><div><b>'+esc(u.name)+(self?' <span class="note">(you)</span>':'')+'</b><div class="note">'+esc(u.email)+'</div></div></div><div>'+rs+'</div><div class="acts">'+(u.active?pill('Published').replace('Published','Active'):pill('Draft').replace('Draft','Disabled'))+(locked||self?'':'<button class="btn sm" data-t="'+u.id+'" style="margin-left:auto">'+(u.active?'Disable':'Enable')+'</button>')+'</div></div>'}).join('')+'</div>'+
  '<p class="note" style="margin-top:1rem">'+(can('roles')?'Superadmin can change any role.':'Admins can add Editors and Approvers and enable or disable them, but cannot change roles or touch Superadmin accounts.')+'</p>';
  $('#nu').onclick=function(){var rl=can('roles')?ROLES:['Content Editor','Approver'];
    ask('Add user','<label for="un">Name</label><input class="inp w" id="un"><label for="ue">Email</label><input class="inp w" id="ue" type="email"><label for="ur">Role</label><select class="inp w" id="ur">'+rl.map(function(r){return '<option>'+r+'</option>'}).join('')+'</select>','Add',function(){
      var n=$('#un').value.trim(),e=$('#ue').value.trim();if(!n||!e){toast('Name and email are required');return false}
      D.users.push({id:D.nid.u++,name:n,email:e,role:$('#ur').value,active:true});log('Added user: '+n+' as '+$('#ur').value);save();toast('User added');render()})};
  $$('[data-t]').forEach(function(b){b.onclick=function(){var u=D.users.find(function(x){return x.id==b.dataset.t});u.active=!u.active;log((u.active?'Enabled':'Disabled')+' user: '+u.name);save();render()}});
  $$('select[data-r]').forEach(function(s){s.onchange=function(){var u=D.users.find(function(x){return x.id==s.dataset.r});log('Changed role of '+u.name+': '+u.role+' to '+s.value);u.role=s.value;save();toast('Role updated');render()}});
}
function vAudit(){
  $('#main').innerHTML='<div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>Role</th><th>Action</th></tr></thead><tbody>'+(D.log.map(function(l){return '<tr><td>'+esc(l.t)+'</td><td>'+esc(l.who)+'</td><td>'+esc(l.role||'')+'</td><td>'+esc(l.a)+'</td></tr>'}).join('')||'<tr><td colspan="4" class="empty">No activity yet.</td></tr>')+'</tbody></table></div></div>';
}
function vPerm(){
  var rows=[['Create and edit drafts','create'],['Submit for approval','submit'],['Approve or reject','review'],['Publish or unpublish','publish'],['Delete videos','del'],['Manage users','users'],['Change roles','roles'],['View audit log','audit'],['System settings','settings']];
  $('#main').innerHTML='<div class="card" style="padding:0"><div class="tw"><table class="perm"><thead><tr><th>Capability</th>'+ROLES.map(function(r){return '<th>'+r+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td>'+ROLES.map(function(x){return P[x][r[1]]?'<td class="yes" aria-label="Allowed">&#10003;</td>':'<td class="no" aria-label="Not allowed">&ndash;</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div>';
}
function vSet(){
  $('#main').innerHTML='<div class="card" style="margin-bottom:1rem"><h2>Public portal</h2><label style="display:flex;gap:.6rem;align-items:center;margin:0"><input type="checkbox" id="mt" style="width:1.1rem;height:1.1rem"'+(D.maint?' checked':'')+'> Show maintenance banner on the public portal</label></div><div class="card"><h2>Demo data</h2><p class="note">Reset videos, users and the audit log to the starting sample data.</p><button class="btn bad" id="rs">Reset demo data</button></div>';
  $('#mt').onchange=function(){D.maint=$('#mt').checked;log('Maintenance banner '+(D.maint?'on':'off'));save();toast('Saved')};
  $('#rs').onclick=function(){ask('Reset demo data','<p>This restores the sample data and signs everyone out.</p>','Reset',function(){D=seed();save();S=null;try{localStorage.removeItem(SKEY)}catch(e){}render()})};
}

function ask(title,body,okLabel,fn){
  var d=$('#dlg');d.innerHTML='<h2>'+esc(title)+'</h2>'+body+'<div class="row"><button class="btn" id="dx">Cancel</button><button class="btn pri" id="dok">'+esc(okLabel)+'</button></div>';
  d.showModal();$('#dx').onclick=function(){d.close()};$('#dok').onclick=function(){if(fn()!==false)d.close()};
}
render();
})();
</script>
</body>
</html>
